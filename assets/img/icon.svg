<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="telson.dev">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#111e37"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="tmark" x1="0.12" y1="0.12" x2="0.88" y2="0.9">
      <stop offset="0" stop-color="#43d9ff"/>
      <stop offset="0.5" stop-color="#9db8ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <linearGradient id="tring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43d9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0.26"/>
    </linearGradient>
    <radialGradient id="tsheen" cx="0.32" cy="0.1" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tdot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/>
      <stop offset="0.45" stop-color="#54e3ff"/>
      <stop offset="1" stop-color="#2fd9ff"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fe0ff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#4fe0ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4fe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底：圆角深色瓦片 -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="url(#tbg)"/>
  <rect x="2.1" y="2.1" width="59.8" height="59.8" rx="15.9" fill="none" stroke="url(#tring)" stroke-width="1.1"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="url(#tsheen)"/>

  <!-- 翼形 T：上扬的尾扇 -->
  <path fill="url(#tmark)" d="M16.6 16.4
    C21 13.2 43 13.2 47.4 16.4
    C45.3 19 42.8 20.5 39.6 21
    L24.4 21
    C21.2 20.5 18.7 19 16.6 16.4
    Z"/>

  <!-- 翼面高光 -->
  <path d="M19.8 16.0 C23.8 13.4 40.2 13.4 44.2 16.0"
        fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 尾杆 -->
  <rect x="28.9" y="14.2" width="6.2" height="22" rx="3.1" fill="url(#tmark)"/>

  <!-- 圆点：telson.dev 的点 -->
  <circle cx="43" cy="46" r="9" fill="url(#tglow)"/>
  <circle cx="43" cy="46" r="4.3" fill="url(#tdot)"/>
  <circle cx="41.8" cy="44.7" r="1.1" fill="#ffffff" fill-opacity="0.85"/>
</svg>
